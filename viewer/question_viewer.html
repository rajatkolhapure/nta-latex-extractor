<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTA Question & LaTeX Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    /* Styling for Gemini-extracted HTML tables */
    .table-container table {
      border-collapse: collapse;
      min-width: 280px;
      font-size: 0.875rem;
      margin: 0 auto;
    }
    .table-container th, .table-container td {
      border: 1px solid #475569;
      padding: 0.6rem 1.25rem;
      text-align: center;
    }
    .table-container th {
      background-color: #1e293b;
      color: #93c5fd;
      font-weight: 700;
      letter-spacing: 0.025em;
    }
    .table-container td {
      color: #f1f5f9;
      background-color: #0f172a;
    }
    .table-container tr:nth-child(even) td {
      background-color: #1e293b;
    }
    .katex-display {
      margin: 0.75rem 0 !important;
    }

    /* Diagram Dynamic Styling */
    .diagram-frame {
      background-color: #090d16;
      border: 1px solid #334155;
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }
    .diagram-img {
      filter: none;
      transition: filter 0.2s ease;
    }

    /* Light Theme Overrides */
    body.light-theme {
      background-color: #f8fafc !important;
      color: #0f172a !important;
    }
    body.light-theme header {
      border-color: #e2e8f0 !important;
    }
    body.light-theme header h1 {
      color: #0f172a !important;
    }
    body.light-theme header p {
      color: #64748b !important;
    }
    body.light-theme .card-bg {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      color: #0f172a !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.06), 0 2px 4px -2px rgb(0 0 0 / 0.06) !important;
    }
    body.light-theme .card-header-border {
      border-color: #f1f5f9 !important;
    }
    body.light-theme .latex-content {
      color: #1e293b !important;
    }
    body.light-theme .badge-topic {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
      color: #334155 !important;
    }
    body.light-theme .badge-subtopic {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
      color: #64748b !important;
    }
    body.light-theme .bar-panel {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      color: #334155 !important;
    }
    body.light-theme .input-ctrl {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #1e293b !important;
    }
    body.light-theme .diagram-frame {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
    }
    /* Dynamic Diagram Invert: turns pure white strokes into pure black strokes cleanly! */
    body.light-theme .diagram-img {
      filter: invert(1) !important;
    }
    body.light-theme .table-container th {
      background-color: #f1f5f9 !important;
      color: #1e3a8a !important;
      border-color: #cbd5e1 !important;
    }
    body.light-theme .table-container td {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    body.light-theme .table-container tr:nth-child(even) td {
      background-color: #f8fafc !important;
    }
    body.light-theme .table-wrapper {
      background-color: #f8fafc !important;
      border-color: #cbd5e1 !important;
    }
    body.light-theme .opt-default {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
      color: #1e293b !important;
    }
    body.light-theme .opt-badge-default {
      background-color: #e2e8f0 !important;
      color: #475569 !important;
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans antialiased transition-colors duration-200">
  <div class="max-w-6xl mx-auto px-4 py-8">
    
    <!-- Top Bar -->
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          NTA Exam Question & LaTeX Explorer
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Supports LaTeX Math, Observation Tables, HD Diagrams & Dynamic Dark/Light Modes
        </p>
      </div>

      <div class="flex flex-wrap items-center gap-3">
        <!-- Theme Toggle -->
        <button id="themeToggleBtn" onclick="toggleTheme()" class="input-ctrl bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg px-3 py-2 text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
          <span id="themeLabel">Light Mode</span>
        </button>

        <!-- Dataset Selector -->
        <select id="datasetSelector" onchange="switchDataset()" class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          <option value="data/extracted_physics.json">Extracted Physics</option>
          <option value="data/extracted_chemistry.json">Extracted Chemistry</option>
          <option value="data/extracted_mathematics.json">Extracted Mathematics</option>
          <option value="data/test_q30.json">Test: Q30 Meter Bridge</option>
          <option value="data/all_nta_questions.json">Raw NTA Scans (Original)</option>
        </select>

        <!-- Subject Filter -->
        <select id="subjectFilter" onchange="applyFilters()" class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          <option value="ALL">All Subjects</option>
          <option value="Physics">Physics</option>
          <option value="Chemistry">Chemistry</option>
          <option value="Mathematics">Mathematics</option>
        </select>

        <input type="text" id="searchInput" oninput="applyFilters()" placeholder="Search topic or paper..." class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-blue-500 w-44" />
      </div>
    </header>

    <!-- Pagination & Stats Bar -->
    <div class="bar-panel flex items-center justify-between bg-slate-800/60 border border-slate-800 rounded-xl px-4 py-3 mb-6">
      <div id="statsText" class="text-xs text-slate-400 font-medium">
        Loading...
      </div>
      <div class="flex items-center gap-2">
        <button onclick="changePage(-1)" id="prevBtn" class="input-ctrl px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-xs font-semibold rounded-lg border border-slate-700 transition">
          &larr; Previous
        </button>
        <span id="pageIndicator" class="text-xs text-slate-300 font-mono px-2">Page 1 of 1</span>
        <button onclick="changePage(1)" id="nextBtn" class="input-ctrl px-3 py-1.5 bg-slate-800 hover:bg-slate-700 disabled:opacity-30 disabled:cursor-not-allowed text-xs font-semibold rounded-lg border border-slate-700 transition">
          Next &rarr;
        </button>
      </div>
    </div>

    <!-- Questions Feed -->
    <div id="questionsContainer" class="space-y-6">
      <div class="text-center py-12 text-slate-500">Loading dataset...</div>
    </div>

  </div>

  <script>
    let allQuestions = [];
    let filteredQuestions = [];
    let currentPage = 1;
    const pageSize = 10;
    let currentDataset = 'data/extracted_physics.json';
    let isLightMode = false;

    function toggleTheme() {
      isLightMode = !isLightMode;
      document.body.classList.toggle('light-theme', isLightMode);
      const label = document.getElementById('themeLabel');
      if (label) {
        label.innerText = isLightMode ? 'Dark Theme' : 'Light Theme';
      }
      localStorage.setItem('viewer_theme', isLightMode ? 'light' : 'dark');
    }

    // Load saved theme
    if (localStorage.getItem('viewer_theme') === 'light') {
      toggleTheme();
    }

    async function switchDataset() {
      currentDataset = document.getElementById('datasetSelector').value;
      await loadDataset();
    }

    function resolveMediaSrc(p) {
      if (!p) return '';
      p = String(p).replace(/\\/g, '/');
      if (p.startsWith('http://') || p.startsWith('https://') || p.startsWith('data:')) return p;
      if (p.startsWith('file:///')) {
        const dlIdx = p.indexOf('/downloads/');
        if (dlIdx !== -1) {
          return p.substring(dlIdx);
        }
      }
      p = p.replace(/^\.?\//, '');
      return '/' + p;
    }

    async function loadDataset() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = `<div class="text-center py-12 text-slate-500">Loading ${currentDataset}...</div>`;
      try {
        const basename = currentDataset.replace(/^.*[\\\/]/, '');
        const candidates = [
          currentDataset,
          `/${currentDataset.replace(/^\/+/, '')}`,
          `/data/${basename}`,
          `../data/${basename}`,
          `data/${basename}`,
          basename
        ];
        let resp = null;
        for (const u of candidates) {
          try {
            const r = await fetch(u);
            if (r.ok) {
              resp = r;
              break;
            }
          } catch (_) {}
        }
        if (!resp) {
          throw new Error(`File not found: ${currentDataset}`);
        }
        allQuestions = await resp.json();
        filteredQuestions = [...allQuestions];
        currentPage = 1;
        applyFilters();
      } catch (err) {
        container.innerHTML = 
          `<div class="p-6 bg-slate-800/80 border border-slate-700 text-slate-300 rounded-2xl text-center">
            <p class="text-amber-400 font-semibold mb-2">Dataset not yet created: <code>${currentDataset}</code></p>
            <p class="text-xs text-slate-400">Run the extractor for this subject first, or switch to <code>data/all_nta_questions.json</code> to view original scanned questions.</p>
          </div>`;
        document.getElementById('statsText').innerText = `0 questions loaded`;
        document.getElementById('pageIndicator').innerText = `Page 0 of 0`;
        document.getElementById('prevBtn').disabled = true;
        document.getElementById('nextBtn').disabled = true;
      }
    }

    function applyFilters() {
      const sub = document.getElementById('subjectFilter').value;
      const search = document.getElementById('searchInput').value.toLowerCase().trim();

      filteredQuestions = allQuestions.filter(q => {
        const matchSub = sub === 'ALL' || (q.subject && q.subject.toLowerCase() === sub.toLowerCase());
        const matchSearch = !search || 
          (q.paperTitle && q.paperTitle.toLowerCase().includes(search)) || 
          (q.topic && q.topic.toLowerCase().includes(search)) || 
          (q.subTopic && q.subTopic.toLowerCase().includes(search)) || 
          (q.latexQuestion && q.latexQuestion.toLowerCase().includes(search)) || 
          (q.exam && q.exam.toLowerCase().includes(search)) ||
          String(q.questionNumber).includes(search);
        return matchSub && matchSearch;
      });

      currentPage = 1;
      renderCurrentPage();
    }

    function changePage(delta) {
      const maxPage = Math.ceil(filteredQuestions.length / pageSize) || 1;
      currentPage = Math.max(1, Math.min(maxPage, currentPage + delta));
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderCurrentPage() {
      const total = filteredQuestions.length;
      const maxPage = Math.ceil(total / pageSize) || 1;
      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, total);
      const slice = filteredQuestions.slice(startIdx, endIdx);

      document.getElementById('statsText').innerText = `Showing ${total ? startIdx + 1 : 0}-${endIdx} of ${total} questions (${currentDataset})`;
      document.getElementById('pageIndicator').innerText = `Page ${currentPage} of ${maxPage}`;
      document.getElementById('prevBtn').disabled = currentPage <= 1;
      document.getElementById('nextBtn').disabled = currentPage >= maxPage;

      const container = document.getElementById('questionsContainer');
      if (!slice.length) {
        container.innerHTML = `<div class="text-center py-12 text-slate-500">No questions matched the filter.</div>`;
        return;
      }

      container.innerHTML = slice.map((q, idx) => {
        const subjectColor = q.subject === 'Physics' ? 'text-blue-400 bg-blue-500/10 border-blue-500/20' :
                             q.subject === 'Chemistry' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' :
                             'text-purple-400 bg-purple-500/10 border-purple-500/20';

        const isExtracted = Boolean(q.latexQuestion);

        // Badges
        const topicBadge = q.topic ? `<span class="badge-topic text-xs font-medium text-slate-300 bg-slate-800 px-2 py-1 rounded-md border border-slate-700">${q.topic}</span>` : '';
        const subTopicBadge = q.subTopic ? `<span class="badge-subtopic text-xs text-slate-400 bg-slate-900/60 px-2 py-1 rounded-md border border-slate-800">${q.subTopic}</span>` : '';
        
        let diffBadge = '';
        if (q.difficulty) {
          const d = String(q.difficulty).toLowerCase();
          const diffColor = d === 'easy' ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/30' :
                            d === 'hard' ? 'text-rose-400 bg-rose-500/10 border-rose-500/30' :
                            'text-amber-400 bg-amber-500/10 border-amber-500/30';
          diffBadge = `<span class="text-xs font-semibold px-2 py-0.5 rounded border ${diffColor}">${q.difficulty}</span>`;
        }

        let examBadge = '';
        if (q.exam) {
          const isCet = String(q.exam).toUpperCase().includes('CET');
          const examColor = isCet ? 'text-amber-400 bg-amber-500/10 border-amber-500/30' : 'text-blue-400 bg-blue-500/10 border-blue-500/30';
          examBadge = `<span class="text-[11px] font-bold px-2 py-0.5 rounded border ${examColor}">${q.exam}</span>`;
        }

        const modelBadge = q.extractedVia ? `<span class="text-[10px] text-slate-500 font-mono bg-slate-950/60 px-1.5 py-0.5 rounded border border-slate-800">${q.extractedVia}</span>` : '';

        // Question body rendering (LaTeX or Raw Image)
        let bodyHtml = '';
        if (isExtracted) {
          const cleanQuestion = (q.latexQuestion || '')
            .replace(/\\n/g, '\n')
            .replace(/\n{3,}/g, '\n\n')
            .trim();

          bodyHtml += `
            <div class="latex-content text-sm text-slate-200 leading-relaxed mb-4 whitespace-pre-line">
              ${cleanQuestion}
            </div>
          `;

          // Diagram rendering (if question body has a diagram)
          if (q.hasDiagram && q.diagramPath) {
            bodyHtml += `
              <div class="my-4 flex justify-center">
                <div class="diagram-frame rounded-xl p-3 shadow-md inline-block">
                  <img src="${resolveMediaSrc(q.diagramPath)}" alt="Diagram Q${q.questionNumber}" class="diagram-img max-h-72 object-contain" loading="lazy" />
                </div>
              </div>
            `;
          }

          // Table rendering (if question has a data table)
          if (q.hasTable && q.tableHtml) {
            bodyHtml += `
              <div class="table-container my-5 flex justify-center">
                <div class="table-wrapper overflow-x-auto bg-slate-950/70 p-4 rounded-xl border border-slate-700 shadow-lg">
                  ${q.tableHtml}
                </div>
              </div>
            `;
          }

        } else if (q.localImagePath) {
          bodyHtml += `
            <div class="mb-5 bg-white p-3 rounded-xl inline-block shadow-inner">
              <img src="${resolveMediaSrc(q.localImagePath)}" alt="Question ${q.questionNumber}" class="max-h-72 object-contain rounded" loading="lazy" />
            </div>
          `;
        }

        // Options rendering
        let optionsHtml = '';
        const optionsList = q.latexOptions && q.latexOptions.length ? q.latexOptions : (q.options || []);
        const optDiagramsMap = q.optionDiagrams || {};

        optionsHtml = `
          <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
            ${optionsList.map(opt => {
              const optKey = String(opt.key || '');
              const isCorrect = (q.correctOptions || []).map(String).includes(optKey);
              const optDiagramPath = optDiagramsMap[optKey];
              const optText = opt.latex || opt.text || '';

              let optionContent = '';
              if (optDiagramPath) {
                optionContent = `
                  <div class="flex flex-col items-center py-2 w-full">
                    <div class="diagram-frame p-2 rounded-lg inline-block shadow-sm">
                      <img src="${resolveMediaSrc(optDiagramPath)}" alt="Option ${optKey}" class="diagram-img max-h-28 object-contain" loading="lazy" />
                    </div>
                    ${optText && !optText.startsWith('[') ? `<span class="mt-1.5 text-xs text-slate-300 latex-content">${optText}</span>` : ''}
                  </div>
                `;
              } else {
                optionContent = `<span class="latex-content">${optText}</span>`;
              }

              return `
                <div class="flex items-start p-3 rounded-xl border ${isCorrect ? 'border-emerald-500/40 bg-emerald-500/10 text-emerald-300' : 'opt-default border-slate-700 bg-slate-900/40 text-slate-300'} text-xs transition">
                  <span class="w-5 h-5 rounded-full flex items-center justify-center font-bold mr-2 text-[11px] shrink-0 mt-0.5 ${isCorrect ? 'bg-emerald-500 text-slate-950' : 'opt-badge-default bg-slate-800 text-slate-400'}">
                    ${optKey}
                  </span>
                  <div class="flex-1">${optionContent}</div>
                  ${isCorrect ? '<span class="ml-2 text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-mono shrink-0">Answer Key</span>' : ''}
                </div>
              `;
            }).join('')}
          </div>
        `;

        return `
          <div class="card-bg bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl hover:border-slate-600 transition">
            <div class="card-header-border flex flex-wrap items-center justify-between border-b border-slate-700/60 pb-3 mb-4 gap-2">
              <div class="flex flex-wrap items-center gap-2">
                ${examBadge}
                <span class="text-xs font-semibold px-2.5 py-1 rounded-lg border ${subjectColor}">
                  ${q.subject || 'Unclassified'}
                </span>
                <span class="badge-topic text-xs font-medium text-slate-400 bg-slate-900/60 px-2 py-1 rounded-md border border-slate-800 font-mono">
                  Q${q.questionNumber}
                </span>
                ${diffBadge}
                ${topicBadge}
                ${subTopicBadge}
                <span class="text-xs text-slate-500">
                  Paper ${q.paperId}
                </span>
              </div>
              <div class="flex items-center gap-2">
                ${modelBadge}
                <div class="text-xs font-mono text-slate-400">
                  +${q.marks || 4} / -${q.negativeMarks || 1}
                </div>
              </div>
            </div>

            <!-- Question Body & Rich Media -->
            ${bodyHtml}

            <!-- Options Grid -->
            ${optionsHtml}
          </div>
        `;
      }).join('');

      // Trigger KaTeX rendering across all math spans
      renderMathInElement(container, {
        delimiters: [
          {left: '$$', right: '$$', display: true},
          {left: '$', right: '$', display: false},
          {left: '\\(', right: '\\)', display: false},
          {left: '\\[', right: '\\]', display: true}
        ],
        throwOnError: false
      });
    }

    window.addEventListener('DOMContentLoaded', loadDataset);
  </script>
</body>
</html>
