<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NTA Question & LaTeX Explorer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
  <style>
    /* Styling for Gemini-extracted HTML tables */
    .table-container table {
      border-collapse: collapse;
      min-width: 280px;
      font-size: 0.875rem;
      margin: 0 auto;
    }
    .table-container th, .table-container td {
      border: 1px solid #334155;
      padding: 8px 12px;
      text-align: center;
    }
    .table-container th {
      background-color: #1e293b;
      color: #94a3b8;
      font-weight: 600;
    }
    .table-container tr:nth-child(even) {
      background-color: rgba(30, 41, 59, 0.5);
    }
    .light-theme {
      background-color: #f8fafc;
      color: #0f172a;
    }
    .light-theme .card-bg {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1) !important;
    }
    .light-theme .card-header-border {
      border-color: #f1f5f9 !important;
    }
    .light-theme .badge-topic {
      background-color: #f1f5f9 !important;
      border-color: #e2e8f0 !important;
      color: #64748b !important;
    }
    .light-theme .bar-panel {
      background-color: #ffffff !important;
      border-color: #e2e8f0 !important;
      color: #334155 !important;
    }
    .light-theme .input-ctrl {
      background-color: #ffffff !important;
      border-color: #cbd5e1 !important;
      color: #1e293b !important;
    }
    .light-theme .diagram-frame {
      background-color: #f1f5f9 !important;
      border-color: #cbd5e1 !important;
    }
    /* Dynamic Diagram Invert: turns pure white strokes into pure black strokes cleanly! */
    body.light-theme .diagram-img {
      filter: invert(1) !important;
    }
    body.light-theme .table-container th {
      background-color: #f1f5f9 !important;
      color: #1e3a8a !important;
      border-color: #cbd5e1 !important;
    }
    body.light-theme .table-container td {
      background-color: #ffffff !important;
      color: #0f172a !important;
      border-color: #cbd5e1 !important;
    }
    .opt-default { background-color: rgba(15, 23, 42, 0.6); }
    .light-theme .opt-default {
      background-color: #f8fafc !important;
      border-color: #e2e8f0 !important;
      color: #334155 !important;
    }
    .light-theme .opt-badge-default {
      background-color: #e2e8f0 !important;
      color: #64748b !important;
    }
    .verified-card {
      border-color: #10b981 !important;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.1) !important;
    }
    .light-theme .verified-card {
      border-color: #10b981 !important;
      background-color: #f0fdf4 !important;
    }
    .flagged-card {
      border-color: #ef4444 !important;
      box-shadow: 0 0 15px rgba(239, 68, 68, 0.15) !important;
    }
    .light-theme .flagged-card {
      border-color: #ef4444 !important;
      background-color: #fef2f2 !important;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-200 min-h-screen font-sans selection:bg-blue-500/30 transition-colors duration-300">
  <div class="max-w-6xl mx-auto px-4 py-8">
    <header class="flex flex-col md:flex-row md:items-center justify-between border-b border-slate-800 pb-6 mb-6 gap-4">
      <div>
        <h1 class="text-2xl font-bold text-white flex items-center gap-2">
          NTA Exam Question & LaTeX Explorer
        </h1>
        <p class="text-slate-400 text-sm mt-1">
          Supports LaTeX Math, Observation Tables, HD Diagrams & Human Verification
        </p>
      </div>
      <div class="flex flex-wrap items-center gap-3">
        <a href="/viewer/rapid_verifier.html" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-3 py-2 text-sm font-medium transition shadow-sm">
          Rapid Verifier (Split-Screen)
        </a>
        <button id="themeToggleBtn" onclick="toggleTheme()" class="input-ctrl bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg px-3 py-2 text-sm font-medium transition flex items-center gap-1.5 shadow-sm">
          <span id="themeLabel">Light Theme</span>
        </button>
      </div>
    </header>

    <div class="bar-panel flex flex-wrap items-center justify-between bg-slate-800/60 border border-slate-800 rounded-xl px-4 py-3 mb-6 gap-3">
      <div class="flex flex-wrap items-center gap-2">
        <select id="datasetSelector" onchange="switchDataset()" class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          <option value="data/extracted_physics.json">Physics</option>
          <option value="data/extracted_chemistry.json">Chemistry</option>
          <option value="data/extracted_mathematics.json">Mathematics</option>
        </select>
        <input type="text" id="searchInput" oninput="onSearchInput()" placeholder="Search topic, subtopic, text..." class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500 w-48 md:w-64">
        <select id="difficultyFilter" onchange="renderCurrentPage()" class="input-ctrl bg-slate-800 border border-slate-700 rounded-lg px-3 py-2 text-sm text-slate-200 focus:outline-none focus:border-blue-500">
          <option value="">All Difficulties</option>
          <option value="Easy">Easy</option>
          <option value="Medium">Medium</option>
          <option value="Hard">Hard</option>
        </select>
        <label class="flex items-center gap-1.5 cursor-pointer text-sm text-slate-400 hover:text-slate-200">
          <input type="checkbox" id="showOnlyFlagged" onchange="renderCurrentPage()" class="w-4 h-4 accent-rose-500 border-slate-600 rounded bg-slate-800 focus:ring-2 focus:ring-rose-500">
          Show only flagged
        </label>
        <span id="statsText" class="text-xs text-slate-500 font-mono hidden md:inline ml-2"></span>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="changePage(-1)" class="input-ctrl bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg p-2 transition shadow-sm">Prev</button>
        <span id="pageIndicator" class="text-sm font-medium px-2">Page 1</span>
        <button onclick="changePage(1)" class="input-ctrl bg-slate-800 border border-slate-700 hover:border-slate-500 rounded-lg p-2 transition shadow-sm">Next</button>
      </div>
    </div>

    <div id="questionsContainer" class="space-y-6">
      <div class="text-center py-12 text-slate-500">Loading dataset...</div>
    </div>
  </div>

  <script>
    let allQuestions = [];
    let filteredQuestions = [];
    let verifications = {};
    let currentPage = 1;
    const pageSize = 10;
    let currentDataset = 'data/extracted_physics.json';
    let isLightMode = false;

    function vKey(pId, qNum) { return `${pId}_${qNum}`; }

    async function loadVerifications() {
      try {
        const r = await fetch('/data/verifications.json');
        if (r.ok) verifications = await r.json();
      } catch (_) {}
    }

    async function postVerification(q, status) {
      try {
        await fetch('/api/verify', {
          method: 'POST',
          body: JSON.stringify({
            paperId: q.paperId,
            questionNumber: q.questionNumber,
            status: status,
            diagramPath: q.diagramPath || null,
          }),
        });
      } catch (_) {}
    }

    function toggleVerification(btn, paperId, questionNumber, diagramPath, targetStatus = 'verified') {
      console.log("toggleVerification called:", paperId, questionNumber, targetStatus);
      const key = vKey(paperId, questionNumber);
      const currentStatus = verifications[key]?.status;
      const newStatus = currentStatus === targetStatus ? 'pending' : targetStatus;

      if (newStatus === 'pending') delete verifications[key];
      else verifications[key] = { status: newStatus, diagramPath: diagramPath || null };

      postVerification({ paperId, questionNumber, diagramPath }, newStatus);
      renderCurrentPage();
    }

    function toggleTheme() {
      isLightMode = !isLightMode;
      document.body.classList.toggle('light-theme', isLightMode);
      document.getElementById('themeLabel').innerText = isLightMode ? 'Dark Theme' : 'Light Theme';
      localStorage.setItem('viewer_theme', isLightMode ? 'light' : 'dark');
    }

    if (localStorage.getItem('viewer_theme') === 'light') toggleTheme();

    async function switchDataset() {
      currentDataset = document.getElementById('datasetSelector').value;
      await loadDataset();
    }

    function resolveMediaSrc(p) {
      if (!p) return '';
      p = String(p).replace(/\\/g, '/');
      if (p.startsWith('http') || p.startsWith('data:')) return p;
      return '/' + p.replace(/^\.?\//, '');
    }

    async function loadDataset() {
      const container = document.getElementById('questionsContainer');
      container.innerHTML = `<div class="text-center py-12 text-slate-500">Loading...</div>`;
      await loadVerifications();
      try {
        const resp = await fetch('/' + currentDataset.replace(/^\//,''));
        allQuestions = await resp.json();
        filteredQuestions = [...allQuestions];
        currentPage = 1;
        renderCurrentPage();
      } catch (e) {
        container.innerHTML = `<div class="text-red-400 p-4">Error: ${e.message}</div>`;
      }
    }

    function changePage(delta) {
      const max = Math.ceil(filteredQuestions.length / pageSize) || 1;
      currentPage = Math.max(1, Math.min(max, currentPage + delta));
      renderCurrentPage();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function onSearchInput() {
      currentPage = 1;
      renderCurrentPage();
    }

    function renderCurrentPage() {
      const onlyFlagged = document.getElementById('showOnlyFlagged')?.checked;
      const searchText = (document.getElementById('searchInput')?.value || '').toLowerCase().trim();
      const selectedDifficulty = document.getElementById('difficultyFilter')?.value || '';

      let workingQuestions = allQuestions;

      if (onlyFlagged) {
        workingQuestions = workingQuestions.filter(q => verifications[vKey(q.paperId, q.questionNumber)]?.status === 'needs_fix');
      }

      if (selectedDifficulty) {
        workingQuestions = workingQuestions.filter(q => String(q.difficulty || '').toLowerCase() === selectedDifficulty.toLowerCase());
      }

      if (searchText) {
        workingQuestions = workingQuestions.filter(q => {
          const topic = String(q.topic || '').toLowerCase();
          const subTopic = String(q.subTopic || '').toLowerCase();
          const text = String(q.latexQuestion || q.questionText || '').toLowerCase();
          const paperTitle = String(q.paperTitle || '').toLowerCase();
          return topic.includes(searchText) || subTopic.includes(searchText) || text.includes(searchText) || paperTitle.includes(searchText);
        });
      }

      filteredQuestions = workingQuestions;
      const total = filteredQuestions.length;
      const startIdx = (currentPage - 1) * pageSize;
      const endIdx = Math.min(startIdx + pageSize, total);
      const slice = filteredQuestions.slice(startIdx, endIdx);

      document.getElementById('pageIndicator').innerText = `Page ${currentPage} / ${Math.ceil(total/pageSize) || 1}`;
      document.getElementById('statsText').innerText = `Showing ${total?startIdx+1:0}-${endIdx} of ${total}${onlyFlagged ? ' (flagged only)' : ''}`;

      const container = document.getElementById('questionsContainer');
      container.innerHTML = slice.map(q => {
        const key = vKey(q.paperId, q.questionNumber);
        const v = verifications[key];
        const isFlagged = v?.status === 'needs_fix';
        const isVerified = v?.status === 'verified';
        const vClass = isFlagged ? 'flagged-card' : (isVerified ? 'verified-card' : '');
        const btnClass = isFlagged ? 'bg-rose-600 text-white border-rose-500' : (isVerified ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700/50 text-slate-400 border-slate-600');
        const btnText = isFlagged ? '✗ Flagged' : (isVerified ? '✓ Verified' : 'Flag');

        return `
          <div class="card-bg ${vClass} bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 shadow-xl transition">
            <div class="flex flex-wrap justify-between items-center border-b border-slate-700/60 pb-3 mb-4 gap-2">
              <div class="flex flex-wrap gap-2 items-center">
                <span class="text-xs font-bold px-2 py-1 bg-slate-900 border border-slate-700 rounded-md">Q${q.questionNumber}</span>
                <span class="text-xs text-slate-500">ID: ${q.paperId}</span>
                ${q.topic ? `<span class="text-[11px] px-2 py-0.5 bg-blue-950/60 border border-blue-800/60 text-blue-300 rounded">Topic: ${q.topic}</span>` : ''}
                ${q.subTopic ? `<span class="text-[11px] px-2 py-0.5 bg-purple-950/60 border border-purple-800/60 text-purple-300 rounded">Sub: ${q.subTopic}</span>` : ''}
                ${q.difficulty ? `<span class="text-[11px] px-2 py-0.5 bg-amber-950/60 border border-amber-800/60 text-amber-300 rounded">${q.difficulty}</span>` : ''}
              </div>
              <div class="flex gap-2 items-center">
                <button type="button" onclick="toggleVerification(this, '${q.paperId}', '${q.questionNumber}', '${(q.diagramPath || '').replace(/\\/g, '\\\\')}', 'needs_fix')" class="text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-full border transition ${isFlagged ? 'bg-rose-600 text-white border-rose-500' : 'bg-slate-700/50 text-slate-400 border-slate-600 hover:border-rose-500'}">
                  ${isFlagged ? '✗ Flagged' : 'Flag Error'}
                </button>
                <button type="button" onclick="toggleVerification(this, '${q.paperId}', '${q.questionNumber}', '${(q.diagramPath || '').replace(/\\/g, '\\\\')}', 'verified')" class="text-[10px] uppercase tracking-wider font-bold px-2.5 py-1 rounded-full border transition ${isVerified ? 'bg-emerald-600 text-white border-emerald-500' : 'bg-slate-700/50 text-slate-400 border-slate-600 hover:border-emerald-500'}">
                  ${isVerified ? '✓ Verified' : 'Verify'}
                </button>
              </div>
            </div>

            <div class="prose prose-invert max-w-none text-slate-200">
              ${q.latexQuestion || q.questionText || 'No text'}
            </div>

            ${q.hasDiagram ? `
              <div class="my-4 flex justify-center">
                <div class="diagram-frame rounded-xl p-3 shadow-md inline-block">
                  <img src="${resolveMediaSrc(q.diagramPath)}" class="diagram-img max-h-72" />
                </div>
              </div>` : ''}

            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mt-4">
              ${(q.latexOptions || []).map(opt => `
                <div class="p-3 rounded-xl border border-slate-700 bg-slate-900/40 text-xs">
                  <span class="font-bold mr-2 text-slate-500">${opt.key}.</span> ${opt.latex}
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }).join('');
      renderMathInElement(container, { delimiters: [
        {left: '$$', right: '$$', display: true},
        {left: '$', right: '$', display: false},
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ], throwOnError: false });
    }

    window.addEventListener('DOMContentLoaded', loadDataset);
  </script>
</body>
</html>
